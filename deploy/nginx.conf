# Include in nginx's http context. Replace hostname and certificate paths.
# Clients need to trust the LAN CA. Only this proxy may reach Waitress.
limit_req_zone $binary_remote_addr zone=trace_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=trace_clients:10m;
limit_conn_zone $server_name zone=trace_total:10m;
limit_req_zone $binary_remote_addr zone=trace_requests:10m rate=5r/s;
# Do not persist assessment search terms, request URLs or client identifiers.
log_format trace_min '$time_iso8601 $status $body_bytes_sent';
access_log /var/log/nginx/trace-access.log trace_min;

server {
    listen 127.0.0.1:80; # For LAN access, replace with a specific private interface IP.
    server_name trace.example.internal;
    return 301 https://trace.example.internal$request_uri;
}

server {
    listen 127.0.0.1:443 ssl; # LAN binding is an explicit operator choice.
    server_name trace.example.internal;
    ssl_certificate /etc/nginx/tls/trace.crt;
    ssl_certificate_key /etc/nginx/tls/trace.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn trace_clients 8;
    limit_conn trace_total 32;
    limit_conn_status 429;
    limit_req zone=trace_requests burst=20 nodelay;
    client_max_body_size 64m; # Match reviewed application upload limits.
    limit_req_status 429;

    location ~ ^/(accounts/login/|admin/login/)$ {
        limit_req zone=trace_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Do not create a location exposing private evidence storage.
}

