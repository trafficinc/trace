<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title description">
  <title id="title">TRACE</title>
  <desc id="description">The TRACE aircraft mark and wordmark in Flight blue on a dark graphite technical grid. Private security-testing documentation, run locally or on your own server.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#245ad1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#245ad1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b2c6ee" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1120" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="320" fill="url(#surface)"/>
    <rect width="1120" height="320" fill="url(#grid)"/>
    <ellipse cx="950" cy="155" rx="410" ry="290" fill="url(#glow)"/>
    <g fill="none" stroke="#729bf0" stroke-opacity=".22">
      <circle cx="1030" cy="160" r="100"/>
      <circle cx="1030" cy="160" r="155"/>
      <circle cx="1030" cy="160" r="210"/>
      <path d="M790 160h290M1030 30v260M750 260l110-100-65-80"/>
    </g>
    <path d="M0 0h1120" stroke="#5f8ef0" stroke-width="4"/>
    <rect x="64" y="70" width="176" height="176" rx="32" fill="#245ad1"/>
    <rect x="72" y="78" width="160" height="160" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".17"/>
    <!-- Original TRACE mark from static/img/trace-mark.svg. -->
    <g transform="translate(92 98) scale(1.875)" fill="#ffffff">
      <path d="M32 3 36 20V51L32 60 28 51V20Z"/>
      <path d="M24 22 3 40V47L24 37ZM40 22 61 40V47L40 37Z"/>
      <path d="m24 46-9 9v3l9-3Zm16 0 9 9v3l-9-3Z"/>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <text x="280" y="97" fill="#a7bff3" font-size="13" font-weight="650" letter-spacing="3">PRIVATE DOCUMENTATION WORKSPACE</text>
      <text x="273" y="194" fill="#ffffff" font-size="108" font-weight="800" font-style="italic" letter-spacing="9">TRACE</text>
      <path d="M282 216h68" stroke="#5f8ef0" stroke-width="4" stroke-linecap="round"/>
      <text x="280" y="253" fill="#c4d0e6" font-size="15" letter-spacing="2">FINDINGS  /  EVIDENCE  /  COLLABORATION</text>
      <text x="1056" y="45" text-anchor="end" fill="#b6c9ef" font-size="11" font-weight="600" letter-spacing="2">LOCAL / SERVER</text>
    </g>
    <circle cx="1030" cy="160" r="6" fill="#8ab0ff"/>
  </g>
</svg>
