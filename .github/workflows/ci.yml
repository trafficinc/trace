name: TRACE checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/quality.txt
      - run: python -m ruff check apps config scripts tests
      - run: python -m mypy
      - run: python -m bandit -r apps config scripts -c pyproject.toml
      - run: python scripts/vendor_assets.py --check
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRACE_RUN_STARTUP_TESTS: '1'
      TRACE_TEST_PG_DSN: host=127.0.0.1 port=5432 user=postgres password=disposable-test-only dbname=postgres
      TRACE_ALLOWED_HOSTS: localhost,127.0.0.1
      TRACE_CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: python -m pip install -r requirements/test.txt -r requirements/postgres.txt
      - name: Generate disposable deployment-check secret
        run: python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('TRACE_SECRET_KEY='+secrets.token_urlsafe(64)+'\n')"
      - run: python manage.py migrate --noinput
      - run: python manage.py configure_sqlite
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python -m pytest
      - run: python manage.py collectstatic --noinput --settings=config.settings.production
      - run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/quality.txt
      - run: python -m pip_audit -r requirements/runtime.txt -r requirements/test.txt -r requirements/quality.txt -r requirements/postgres.txt --no-deps --disable-pip --format json -o python-advisories.json
      - run: python scripts/check_vendor_advisories.py vendor-advisories.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-package-advisories
          path: '*-advisories.json'
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRACE_RUN_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/test.txt
      - run: docker build --pull -t trace-local:0.1.0 .
      - run: docker pull nginx:stable-alpine
      - run: python -m pytest tests/test_docker_startup.py -q
