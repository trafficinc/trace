{% extends 'layouts/application.html' %}{% block content %}<div class="trace-page-heading"><h1>Reports</h1>{% if can_edit %}<a class="btn trace-primary" href="{% url 'reports:create' engagement.pk %}">New report</a>{% endif %}<a href="{% url 'report_templates:list' %}">Report templates</a></div>
<form method="get" class="card eng-panel" hx-get="{% url 'reports:list' engagement.pk %}" hx-target="#report-results" hx-swap="outerHTML"><label for="report-q">Report title</label><input class="form-control" id="report-q" type="search" name="q" maxlength="200" value="{{ query }}"><label for="report-sort">Sort reports</label><select id="report-sort" name="sort" class="form-select"><option value="-updated_at" {% if sort == '-updated_at' %}selected{% endif %}>Recently updated</option><option value="title" {% if sort == 'title' %}selected{% endif %}>Title A–Z</option><option value="-title" {% if sort == '-title' %}selected{% endif %}>Title Z–A</option></select><button type="submit" class="btn trace-primary">Filter reports</button></form>
{% include 'reports/components/report_results.html' %}{% endblock %}
