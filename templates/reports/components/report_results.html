<section id="report-results" class="card eng-panel" hx-history="false"><div class="table-responsive" role="region" aria-label="Report results" tabindex="0"><table class="table"><caption class="visually-hidden">{{ page.paginator.count }} report setups</caption><thead><tr><th scope="col">Report</th><th scope="col">Setup version</th><th scope="col">Updated</th></tr></thead><tbody>{% for report in reports %}<tr><th scope="row"><a href="{% url 'reports:detail' engagement.pk report.pk %}">{{ report.title }}</a></th><td>{{ report.version }}</td><td>{{ report.updated_at|date:'Y-m-d H:i' }} UTC</td></tr>{% empty %}<tr><td colspan="3">No matching reports.</td></tr>{% endfor %}</tbody></table></div>{% include 'components/pagination.html' %}</section>
