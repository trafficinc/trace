{% extends 'layouts/application.html' %}{% block title %}Findings · TRACE{% endblock %}{% block content %}
<div class="trace-page-heading"><div><p class="trace-eyebrow">{{ engagement.name }}</p><h1>Findings</h1></div>{% if can_write %}<a class="btn trace-primary" href="{% url 'findings:create' engagement.pk %}">New finding</a><a href="{% url 'finding_templates:list' %}">Use a template</a>{% endif %}</div>
<form method="get"><label>Search <input name="q" value="{{ query }}" maxlength="200"></label><label>Severity <select name="severity"><option value="">All severities</option>{% for value,label in severities %}<option value="{{ value }}" {% if request.GET.severity == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Status <select name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Sort <select name="sort"><option value="-updated_at" {% if sort == '-updated_at' %}selected{% endif %}>Recently updated</option><option value="severity" {% if sort == 'severity' %}selected{% endif %}>Severity</option><option value="title" {% if sort == 'title' %}selected{% endif %}>Title</option><option value="status" {% if sort == 'status' %}selected{% endif %}>Status</option><option value="created_at" {% if sort == 'created_at' %}selected{% endif %}>Oldest first</option></select></label><button type="submit">Filter</button></form>
{% include 'components/finding_results.html' %}{% endblock %}
