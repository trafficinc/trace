{% extends 'layouts/application.html' %}{% block title %}Evidence · TRACE{% endblock %}{% block content %}<div class="trace-page-heading"><div><p class="trace-eyebrow">{{ engagement.name }}</p><h1>Evidence</h1></div>{% if can_upload %}<a class="btn trace-primary" href="{% url 'evidence:upload' engagement.pk %}">Upload evidence</a>{% endif %}</div>{% include 'components/evidence_usage.html' %}<form method="get" class="eng-filters" hx-get="{% url 'evidence:list' engagement.pk %}" hx-target="#evidence-results" hx-swap="outerHTML"><label for="evidence-q">Filename or description</label><input class="form-control" type="search" id="evidence-q" name="q" value="{{ query }}" maxlength="200"><label for="evidence-kind">Type</label><select class="form-select" id="evidence-kind" name="kind"><option value="">All types</option>{% for value in kinds %}<option value="{{ value }}" {% if value == kind %}selected{% endif %}>{{ value|upper }}</option>{% endfor %}</select><label for="evidence-sort">Sort evidence</label><select class="form-select" id="evidence-sort" name="sort"><option value="-created_at" {% if sort == '-created_at' %}selected{% endif %}>Newest first</option><option value="original_filename" {% if sort == 'original_filename' %}selected{% endif %}>Filename</option><option value="size" {% if sort == 'size' %}selected{% endif %}>Smallest first</option><option value="-size" {% if sort == '-size' %}selected{% endif %}>Largest first</option></select><button class="btn trace-primary" type="submit">Filter evidence</button></form>{% include 'components/evidence_results.html' %}{% endblock %}
