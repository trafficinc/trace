{% if page.paginator.num_pages > 1 %}<nav aria-label="Table pages"><ul class="pagination flex-wrap">
{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page.previous_page_number }}" aria-label="Previous page">Previous</a></li>{% endif %}
<li class="page-item"><span class="page-link" aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
{% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page.next_page_number }}" aria-label="Next page">Next</a></li>{% endif %}
</ul></nav>{% endif %}
