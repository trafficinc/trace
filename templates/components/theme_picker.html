<fieldset class="trace-theme-picker" data-theme-picker hidden>
  <legend>Appearance</legend>
  <label>Palette
    <select data-theme-palette>
      <option value="flight">Flight blue</option>
      <option value="graphite">Neutral graphite</option>
      <option value="ubuntu">Ubuntu aubergine</option>
    </select>
  </label>
  <label>Mode
    <select data-theme-mode>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System</option>
    </select>
  </label>
</fieldset>
