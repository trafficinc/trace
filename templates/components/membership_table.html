<section class="card trace-table-wrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Revoke access</th></tr></thead><tbody>{% for member in memberships %}<tr><td>{{ member.user.username }}{% if not member.user.is_active %} <small>Disabled account</small>{% endif %}</td><td><form method="post" action="{% url 'engagements:member_change' engagement.pk member.pk %}" class="trace-inline-form">{% csrf_token %}<input type="hidden" name="version" value="{{ member.version }}"><label class="trace-visually-hidden" for="role-{{ member.pk }}">Role for {{ member.user.username }}</label><select id="role-{{ member.pk }}" name="role">{% for value,label in roles %}<option value="{{ value }}" {% if member.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn trace-secondary" type="submit">Save</button></form></td><td><form method="post" action="{% url 'engagements:member_revoke' engagement.pk member.pk %}">{% csrf_token %}<input type="hidden" name="version" value="{{ member.version }}"><button class="btn trace-secondary" type="submit">Revoke<span class="trace-visually-hidden"> {{ member.user.username }}</span></button></form></td></tr>{% empty %}<tr><td colspan="3">No members.</td></tr>{% endfor %}</tbody></table></section>
